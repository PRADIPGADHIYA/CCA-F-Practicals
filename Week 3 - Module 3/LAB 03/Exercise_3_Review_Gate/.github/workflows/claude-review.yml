name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Capture the PR diff
        run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff

      - name: Headless Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Review the pull request diff in pr.diff. Follow .claude/commands/pr-review.md. Output only a JSON object with decision (approve or request_changes) and issues (array of {severity, message})." --output-format json --allowedTools "Read" > review.json

      - name: Gate on the JSON verdict
        run: python scripts/review_gate.py review.json
